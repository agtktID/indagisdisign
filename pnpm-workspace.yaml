# Indagis Studio est une application **autonome**, pas un espace de travail : un seul
# package.json applicatif, aucune app voisine. Ce champ était absent, et pnpm comblait le
# vide en absorbant tout sous-dossier portant un package.json — à commencer par `video/`,
# où les ponts HyperFrames et Remotion installent les projets de composition de
# l'utilisateur.
#
# Conséquence, vérifiée : `pnpm install` ajoutait `video/essai-pont` et
# `video/essai-remotion` au lockfile, avec leurs 12 dépendances. Or `video/` est ignoré
# par git (.gitignore:49). Le lockfile suivi décrivait donc des paquets que personne
# d'autre ne possède, `pnpm install --frozen-lockfile` échouait en local sans échouer en
# CI, et deux alertes de sécurité — `braces`, `@eslint/plugin-kit` — ne venaient que de
# là.
#
# Liste vide : la racine seule. Les projets vidéo gardent leurs propres node_modules,
# installés à la demande par les ponts, et n'entrent plus dans le lockfile du dépôt.
packages: []

allowBuilds:
  tesseract.js: true
  node-pty: true
  esbuild: true

overrides:
  # GHSA-68fv-2mgg-jv7q — déni de service sur la boucle d'événements. postcss
  # demande "^1.2.1" et 1.2.2 est dans la plage : aucun risque de rupture.
  # Chemin de build uniquement, jamais livré au navigateur (absent de .output).
  source-map-js: "1.2.2"
  "@tiptap/starter-kit": "3.31.4"
  "@tiptap/react": "3.31.4"
  "@tiptap/pm": "3.31.4"
  "@tiptap/extensions": "3.31.4"
  "@tiptap/extension-underline": "3.31.4"
  "@tiptap/extension-text-style": "3.31.4"
  "@tiptap/extension-text": "3.31.4"
  "@tiptap/extension-task-list": "3.31.4"
  "@tiptap/extension-task-item": "3.31.4"
  "@tiptap/extension-table-row": "3.31.4"
  "@tiptap/extension-table-header": "3.31.4"
  "@tiptap/extension-table-cell": "3.31.4"
  "@tiptap/extension-table": "3.31.4"
  "@tiptap/extension-strike": "3.31.4"
  "@tiptap/extension-placeholder": "3.31.4"
  "@tiptap/extension-paragraph": "3.31.4"
  "@tiptap/extension-ordered-list": "3.31.4"
  "@tiptap/extension-list-keymap": "3.31.4"
  "@tiptap/extension-list-item": "3.31.4"
  "@tiptap/extension-list": "3.31.4"
  "@tiptap/extension-link": "3.31.4"
  "@tiptap/extension-italic": "3.31.4"
  "@tiptap/extension-image": "3.31.4"
  "@tiptap/extension-horizontal-rule": "3.31.4"
  "@tiptap/extension-heading": "3.31.4"
  "@tiptap/extension-hard-break": "3.31.4"
  "@tiptap/extension-gapcursor": "3.31.4"
  "@tiptap/extension-floating-menu": "3.31.4"
  "@tiptap/extension-dropcursor": "3.31.4"
  "@tiptap/extension-document": "3.31.4"
  "@tiptap/extension-color": "3.31.4"
  "@tiptap/extension-collaboration-caret": "3.31.4"
  "@tiptap/extension-collaboration": "3.31.4"
  "@tiptap/extension-code-block-lowlight": "3.31.4"
